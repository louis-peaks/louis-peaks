<section class="hero {{ heroClass }}" aria-labelledby="page-title">
  <img class="hero-image" src="{{ image }}" alt="{{ imageAlt }}" width="1800" height="1100" fetchpriority="high">
  <div class="hero-shade" aria-hidden="true"></div>
  <div class="hero-ridges" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="container hero-content">
    <div class="hero-copy"><p class="eyebrow light">{{ eyebrow }}</p><h1 id="page-title">{{ titleLine1 }}<span>{{ titleLine2 }}</span></h1><p class="hero-description">{{ description }}</p>{{ heroActions }}</div>
    {{ heroAside }}
  </div>
  <div class="container hero-baseline"><span>Endurance · Mountains · A life outside</span><a href="#after-hero">Keep exploring <span aria-hidden="true">↓</span></a></div>
</section>
