<article class="post-card" data-post-card data-category="{{ category }}" data-search="{{ search }}">
  <a class="post-link" href="{{ url }}">
    <div class="card-image"><img src="{{ image }}" alt="{{ imageAlt }}" width="1200" height="800" loading="lazy" decoding="async"><span class="image-arrow" aria-hidden="true">↗</span></div>
    <div class="post-card-content"><div class="post-meta"><span>{{ category }}</span><time datetime="{{ date }}">{{ dateLabel }}</time></div><h3>{{ title }}</h3><p>{{ excerpt }}</p><div class="card-bottom"><span>Read the story <span aria-hidden="true">→</span></span>{{ sampleBadge }}</div></div>
  </a>
</article>
